<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Création de Personnage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <div class="base">
        <section>
            <div class="logo">
                <img class="logo-img" src="../assets/logo.png">
            </div>
            <div class="title">
                <h1>Identité de mon personnage</h1>
                <p><strong>Pour créer ton personnage tu dois définir son identité donc ses informations personnelles.</strong></p>
            </div>
            <div class="form">
                <form class="form" method="get" action="">
                    <input type="text" id="prenoms" name="prenoms" placeholder="Prénom(s)" maxlength="50" required>
                    <input type="text" id="nom" name="nom" placeholder="Nom" maxlength="50" required>
                    <input type="date" id="datedenaissance" name="datedenaissance" placeholder="Date de naissance" value="1990-01-01" required>
                    <input type="text" id="lieudenaissance" name="lieudenaissance" maxlength="50" placeholder="Lieu de naissance" required>
                    <!-- <input type="text" placeholder="Nationalité"> -->
                    <select id="nationalite" name="nationalite" placeholder="Nationalité" required>
                        <option value="Française">Française</option>
                        <option value="Étrangère">Étrangère</option>
                    </select>
                    <!-- <input type="text" placeholder="Sexe"> -->
                    <select id="sexe" name="sexe" placeholder="Sexe" required>
                        <option value="MALE">Homme</option>
                        <option value="FEMALE">Femme</option>
                    </select>
                </form>
            </div>
        </section>
        <section>
            <!--<a href="mod://westerlife/create_perso/perso3.html">
                <p class="button-text">Créer mon personnage !</p>
            </a> -->
                <input type="submit" class="button" value="Créer mon personnage !" onclick="createperso()" required>
        </section>
    </div>
</body>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }
    * {
        font-family: 'Montserrat', sans-serif;
    }
    .logo {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    .form {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: row;
        flex-wrap: wrap;
        padding: 10px 25px;
        gap: 10px 25px;
    }
    input, select {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        padding: 10px 25px;
        background: #FFFFFF;
        border-radius: 15px;
        flex: 1 1 200px;
        flex-grow: 1;
        color: #2E364A;
        border: none;
        font-weight: 500;
        font-size: 15px;
    }
    input:focus, select:focus {
        outline: none;
        caret-color: #2E364A;
    }
    .logo-img {
        width: 10%;
    }
    .text {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    .base {
        position: absolute;
        background-color: #2E364A;
        font-family: 'Montserrat', sans-serif;
        border-radius: 15px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 40%;
        height: 50%;
        padding: 35px;
        gap: 40px;
    }
    .section-title {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    .section-pass {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    h1 {
        color: #F6E7D8;
        font-size: 32px;
        text-align: center;
    }
    p {
        color: #FFFFFF;
        font-size: 16px;
        text-align: center;
    }
    .button {
        background-color: #FFFFFF;
        border: none;
        border-radius: 15px;
        color: #2E364A;
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        padding: 5px 30px;
        gap: 5px;
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
    }
    .button:hover {
        background-color: #F0F0F0;
    }
    .button:focus {
        outline:none;
    }
    .button-text, button-img {
        color: #2E364A;
        font-size: 16px;
    }
    .button-img {
        font-size: 24px;
        font-weight: 700;
    }
    a {
        text-decoration: none;
    }
</style>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
    let once = false;
    let perso = "";

    function createperso() {
        if(once) return;
        if(document.getElementById("prenoms").value === "" || document.getElementById("nom").value === "" || document.getElementById("datedenaissance").value === "" || document.getElementById("lieudenaissance").value === "" || document.getElementById("nationalite").value === "" || document.getElementById("sexe").value === "") {
            alert("Veuillez remplir tous les champs.");
            return;
        }
        $(function() {
            window.mcefQuery({
                "request": "$createPersoForm:" + document.getElementById("nom").value + ":" + document.getElementById("prenoms").value + ":" + document.getElementById("datedenaissance").value + ":" + document.getElementById("lieudenaissance").value + ":" + document.getElementById("nationalite").value + ":" + document.getElementById("sexe").value,
                "persistent": false
            });
            document.location.href="mod://westerlife/create_perso/perso3.html";
        });


    }
</script>
</html>
