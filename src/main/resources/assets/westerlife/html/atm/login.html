<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>DAB</title>
    <link rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <div id="main-container">
        <div id="container">
            <div id="top-container">
                <div id="login-title">
                    <p id="login-title-text">Saississez votre code.</p>
                    <input id="login-title-input" type="password" placeholder="****" maxlength="4" pattern="[0-9]{4,4}" required>
                </div>
                <div id="login-numpad">
                    <input class="button" id="button-1" type="button" value="1">
                    <input class="button" id="button-2" type="button" value="2">
                    <input class="button" id="button-3" type="button" value="3">
                    <input class="button" id="button-4" type="button" value="4">
                    <input class="button" id="button-5" type="button" value="5">
                    <input class="button" id="button-6" type="button" value="6">
                    <input class="button" id="button-7" type="button" value="7">
                    <input class="button" id="button-8" type="button" value="8">
                    <input class="button" id="button-9" type="button" value="9">
                    <input class="button" id="button-0" type="button" value="0">
                    <input class="button" id="button-clear" type="button" value="RETOUR">
<!--                    <input class="button" id="button-valid" type="button" value="VALIDER LA SAISIE">-->
                </div>
            </div>
            <div id="bottom-container">
                <div class="eject-button" onclick="close();">
                    <p class="eject-button-text">Éjecter la carte</p>
                </div>
                <div class="logo">
                    <img class="logo-img" src="logo.png" alt="logo">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
