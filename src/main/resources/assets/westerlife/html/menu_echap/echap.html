<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Menu de Pause</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <div class="base">
        <section>
            <div class="logo">
                <img class="logo-img" src="../assets/logo.png">
            </div>
            <div class="title">
                <h1>Menu de Pause</h1>
            </div>
        </section>
        <section class="buttons">
            <button class="button" onclick="closegui()">
                <i class="ri-play-fill button-img"></i>
                <p>Retourner au jeu</p>
            </button>
            <button class="button" onclick="openSettings()">
                <i class="ri-settings-3-line button-img"></i>
                <p>Paramètres</p>
            </button>
            <button class="button" onclick="disconnect()">
                <i class="ri-logout-box-r-line button-img"></i>
                <p>Se déconnecter</p>
            </button>
            <button class="button" onclick="openMicSettings()">
                <i class="ri-mic-line button-img"></i>
                <p>Paramètres micro</p>
            </button>
            <button class="button" onclick="dev()">
<!--                <i class="ri-mic-line button-img"></i>-->
                <p>Dev only</p>
            </button>
        </section>
        <section>
            <div class="rs">
                <a onclick="openLink('youtube')"><i class="ri-youtube-fill icon-rs"></i></a>
                <a onclick="openLink('discord')"><i class="ri-discord-fill icon-rs"></i></a>
                <a onclick="openLink('website')"><i class="ri-external-link-fill icon-rs"></i></a>
                <a onclick="openLink('instagram')"><i class="ri-instagram-fill icon-rs"></i></a>
                <a onclick="openLink('twitter')"><i class="ri-twitter-fill icon-rs"></i></a>
            </div>
            <div>
                <h3>WesterLife n’est pas affilié à Mojang AB.</h3>
            </div>
        </section>
    </div>
</body>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }
    * {
        font-family: 'Montserrat', sans-serif;
    }
    .logo {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    .logo-img {
        width: 50%;
    }
    .text {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    h3 {
        color: #FFFFFF;
        font-size: 16px;
        text-align: center;
        font-weight: 700;
    }
    .rs {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 10px;
    }
    .icon-rs {
        font-size: 25px;
        color: #FFFFFF;
    }
    .icon-rs:hover {
        background: linear-gradient(180deg, #F14902 0%, #F27841 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-fill-color: transparent;
    }
    .base {
        position: absolute;
        background-color: #2E364A;
        font-family: 'Montserrat', sans-serif;
        border-radius: 15px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 20%;
        height: fit-content;
        padding: 35px;
        gap: 50px;
    }
    .buttons {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
    }
    .section-title {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    .section-pass {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    h1 {
        color: #F6E7D8;
        font-size: 32px;
        text-align: center;
        margin-bottom: 0px;
    }
    p {
        background: linear-gradient(180deg, #F14902 0%, #F27841 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-fill-color: transparent;
        font-size: 20px;
        text-align: center;
    }
    .button {
        background-color: #FFFFFF;
        border: none;
        border-radius: 15px;
        color: #2E364A;
        text-color: linear-gradient(180deg, #F14902 0%, #F27841 100%);
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        padding: 0px 50px;
        gap: 25px;
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        min-width: 100%;
    }
    .button:hover {
        background-color: #F0F0F0;
    }
    .button:focus {
        outline:none;
    }
    .button-text, button-img {
        color: #2E364A;
        font-size: 16px;
    }
    .button-img {
        font-size: 25px;
        font-weight: 700;
        background: linear-gradient(180deg, #F14902 0%, #F27841 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-fill-color: transparent;
    }
    a {
        text-decoration: none;
    }
</style>
<script>
    function closegui() {
        window.mcefQuery({
            "request": "$closeGui",
            "persistent": false
        });
    }

    function openLink(rs) {
        window.mcefQuery({
            "request": "$openLink:" + rs,
            "persistent": false
        });
    }

    function disconnect() {
        window.mcefQuery({
            "request": "$disconnect",
            "persistent": false
        });
    }

    function openSettings() {
        window.mcefQuery({
            "request": "$openSettings",
            "persistent": false
        });
    }
    function openMicSettings() {
        window.mcefQuery({
            "request": "$openMicSettings",
            "persistent": false
        });
    }
    function dev() {
        window.mcefQuery({
            "request": "$openLan",
            "persistent": false
        });
    }
</script>
</html>
