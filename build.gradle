buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url "https://jitpack.io/" }
        maven { url 'https://m2.dv8tion.net/releases' }
        maven {
            name = 'sponge'
            url = 'https://repo.spongepowered.org/maven'
        }
        jcenter()
    }
    dependencies {
        classpath 'com.github.jengelman.gradle.plugins:shadow:2.0.4'
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '3.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }

}
repositories {
    mavenCentral()
    maven {
        url 'https://m2.dv8tion.net/releases'
    }
    maven {
        name = "CurseForge"
        url = "https://minecraft.curseforge.com/api/maven/"
    }
    maven {
        url 'https://www.cursemaven.com/'
    }
    maven {
        name = "DragonForge"
        url = "https://maven.zeith.org"
    }
    maven {
        url 'https://m2.dv8tion.net/releases'
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: "java"
apply plugin: 'idea'
apply plugin: 'com.github.johnrengelman.shadow'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'com.github.johnrengelman.shadow'

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

//sourceSets { main { output.resourcesDir = output.classesDir } }

version = '1.5.8'
group = 'fr.yan36.westerlife' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = 'westerlife'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8' // Need this here so eclipse task generates correctly.

minecraft {

    mappings channel: 'stable', version: '39-1.12'

    runs {
        client {
            workingDirectory project.file('WesterLife')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                jw {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('WesterLife')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                jw {
                    source sourceSets.main
                }
            }
        }
    }


    repositories {
        jcenter()
    }

    sourceSets.main.resources { srcDir 'src/generated/resources' }

    dependencies {
        minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'


//        implementation fg.deobf('fr.dynamx:DynamX:4.0.0-beta-26')
        implementation fileTree(dir: 'libs', include: '*.jar')

        shadow fileTree(dir: 'libs', include: '*.jar')


        shadow 'com.sedmelluq:lavaplayer:1.3.78'
//        shadow 'com.sedmelluq:lava-common:1.1.2'
//        shadow 'org.apache.httpcomponents:httpclient:4.5.13'
//        shadow implementation('org.apache.httpcomponents:httpcore:4.4.14')

//        shadow 'org.apache.httpcomponents:httpclient:4.5.13'
//        shadow implementation('org.apache.httpcomponents:httpcore:4.4.14')

        // before project httpclient

        compile 'com.zaxxer:HikariCP:3.1.0'
        compile 'org.slf4j:slf4j-api:1.7.25'
        compile 'mysql:mysql-connector-java:8.0.19'

        annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
        testAnnotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

        annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
        implementation("org.spongepowered:mixin:0.8.2")


//        shadow  ('com.sedmelluq:lavaplayer:1.3.78')
//        shadow  ('com.sedmelluq:lava-common:1.1.2')
    }

    repositories {
        flatDir {
            dirs 'libs'
        }
    }

    jar {
        manifest {
            attributes([
                    "Specification-Title"        : "westerlife",
                    "Specification-Vendor"       : "yan36,MK_16,gabidut76",
                    "Specification-Version"      : "2", // We are version 1 of ourselves
                    "Implementation-Title"       : project.name,
                    "Implementation-Version"     : project.version,
                    "Implementation-Vendor"      : "MK, Afhistos",
                    "Implementation-Timestamp"   : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "Built-By"                   : System.getProperty("user.name"),
                    "Build-Jdk"                  : System.getProperty("java.version"),
                    "FMLCorePluginContainsFMLMod": "true",
                    "FMLCorePlugin"              : "fr.yan36.westerlife.coremod.WesterLifeCoreMod",
                    "FMLAT"                      : "fr.yan36.westerlife.coremod.WesterLifeCoreMod",
            ])
        }
        from {
            configurations.compile
                    .filter {
                        it.name == 'java-discord-rpc-2.0.1.jar' ||
                                it.name == 'mcef-1.12.2-1.32.jar' ||
                                it.name == 'HikariCP-3.1.0.jar' ||
                                it.name == 'slf4j-api-1.7.25.jar' ||
                                it.name == 'mysql-connector-java-8.0.19.jar' ||
                                it.name == 'simpledatabasemanager-1.0.jar' ||
                                it.name == 'lavaplayer.jar'
                    }
                    .collect { it.isDirectory() ? it : zipTree(it) }

        }
    }
}

mixin {
    add sourceSets.main, "refmap.westerlife.json"
    config 'mixins.westerlife.json'
    debug.verbose = true
    debug.export = true
    dumpTargetOnFailure = true
}


// Example for how to get properties into the manifest for reading by the runtime..
jar {
    manifest {
        attributes([
                "Specification-Title"     : "examplemod",
                "Specification-Vendor"    : "examplemodsareus",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "examplemodsareus",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Example configuration to allow publishing using the maven-publish task
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar')
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
//publish.dependsOn('reobfJar')
configurations {
    shade
    shadow {
        transitive(true)
    }
    compile.extendsFrom shadow

    beforeProject

}

build.dependsOn(shadowJar)

shadowJar {
    classifier ''
    project.configurations.shadow.setTransitive(true)
    setDescription("Shadow Jar")
    duplicatesStrategy 'exclude'
    configurations = [project.configurations.shadow]


//    relocate 'org.apache.http.conn', 'org.apache.http.conn'
//    relocate 'org.apache.http.client', 'org.apache.http.client'
//    relocate "com.fasterxml.jackson", "fr.yan36.westerlife.repack.com.fasterxml.jackson"

//    relocate "okio", "fr.yan36.westerlife.repack.okio"
//    relocate "okhttp3", "fr.yan36.westerlife.repack.okhttp3"
//    relocate "org.slf4j", "fr.yan36.westerlife.repack.org.slf4j"

//    relocate "com.sedmelluq", "fr.yan36.westerlife.repack.com.sedmelluq"

}

reobf {
    shadowJar {}
}

jar.finalizedBy('reobfShadowJar')

/** Shit that idea needs to process resources ? **/
idea {
    module {
        inheritOutputDirs = true
    }
}
subprojects {
    apply plugin: 'idea'
}
task prepareAssets(type: Copy) {
    group = 'build'
    from(project.file('src/main/resources'))
    into project.file('build/classes/java/main')




}

classes.dependsOn(prepareAssets)


/** end of shit **/