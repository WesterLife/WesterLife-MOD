buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
        maven{
            url "https://jitpack.io/"
        }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '3.+', changing: true

    }

}
repositories {
    mavenCentral()
    maven {
        name 'm2-dv8tion'
        url 'https://m2.dv8tion.net/releases'
    }
    maven{
        name = "CurseForge"
        url = "https://minecraft.curseforge.com/api/maven/"
    }

    maven {
        url('http://maven.dynamx.fr/artifactory/DynamXRepo/')
    }
    maven {
        url 'https://maven.dynamx.fr/artifactory/' + 'ACsGuisRepo/'
    }
    maven {
        url 'https://www.cursemaven.com/'
    }

}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: "java"
tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

sourceSets { main { output.resourcesDir = output.classesDir } }

version = '1.2'
group = 'fr.yan36.westerlife' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = 'westerlife'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8' // Need this here so eclipse task generates correctly.


minecraft {

    mappings channel: 'stable', version: '39-1.12'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                jw {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                jw {
                    source sourceSets.main
                }
            }
        }
    }


    repositories {
        jcenter()
    }

    sourceSets.main.resources { srcDir 'src/generated/resources' }


    dependencies {

        testCompile group: 'junit', name: 'junit', version: '4.12'
        minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2855'
        compile group: 'mysql', name: 'mysql-connector-java', version: '8.0.21'
        compile fileTree(dir: 'libs', include: '*.jar')

        implementation fg.deobf('fr.dynamx:DynamX:3.3.0')
        compile "fr.aym.acsguis:ACsGuis:1.2.2-1"
        implementation "curse.maven:lizardon-mcef-577541:3641377"
        compile fg.deobf('curse.maven:obfuscate-289380:2912288')
    }


    jar {
        manifest {
            attributes([
                    "Specification-Title"     : "westerlife",
                    "Specification-Vendor"    : "yan36,MK_16,gabidut76",
                    "Specification-Version"   : "2", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.version,
                    "Implementation-Vendor"   : "MK, Afhistos",
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),

            ])
        }

        from {
            configurations.compile
                    //.filter { it.name == 'java-discord-rpc-2.0.1.jar' }
                    .collect { it.isDirectory() ? it : zipTree(it) }
        }

    }

}


// Example for how to get properties into the manifest for reading by the runtime..
jar {
    manifest {
        attributes([
            "Specification-Title": "examplemod",
            "Specification-Vendor": "examplemodsareus",
            "Specification-Version": "1", // We are version 1 of ourselves
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"examplemodsareus",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Example configuration to allow publishing using the maven-publish task
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar') 
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
//publish.dependsOn('reobfJar')
